#!/bin/sh
set -eu
cat <<EOF

source tickets : db_slave
{
        sql_query_pre           = SET CHARACTER SET 'utf8'
        sql_query_pre           = SET SESSION query_cache_type=OFF
        sql_query_pre           = SET SESSION group_concat_max_len = 100000
	sql_query_pre           = SET SESSION max_statement_time = 600

        sql_query_pre           = SELECT GET_LOCK(CONCAT('tickets',DATABASE()),100)
	sql_query_pre           = DO SLEEP(RAND()*5)

        sql_query               = \
                SELECT t.gridimage_ticket_id, t.status, UNIX_TIMESTAMP(t.suggested) AS suggested, \
                gi.title, gi.comment, if(gi.realname!='',gi.realname,u.realname) as realname, gs.grid_reference, \
                SUBSTRING(gs.grid_reference,1,LENGTH(gs.grid_reference)-4) AS myriad, \
                CONCAT(SUBSTRING(gs.grid_reference,1,LENGTH(gs.grid_reference)-3),SUBSTRING(gs.grid_reference,LENGTH(gs.grid_reference)-1,1)) AS hectad, \
                notes, s.realname AS suggester \
                FROM gridimage_ticket t \
                        INNER JOIN gridimage gi ON (gi.gridimage_id = t.gridimage_id) \
                        INNER JOIN gridsquare gs ON (gs.gridsquare_id = gi.gridsquare_id) \
                        INNER JOIN user AS u ON (u.user_id = gi.user_id) \
                        INNER JOIN user AS s ON (s.user_id = t.user_id) \
                WHERE t.status IN ('pending','open')
        sql_attr_timestamp      = suggested

        sql_query_post          = SELECT RELEASE_LOCK(CONCAT('tickets',DATABASE()))
}

index tickets : latin1plus_encoded
{
	type                    = plain
        source                  = tickets
        path                    = /var/lib/manticore/data/tickets
        docinfo                 = extern
        min_word_len            = 1
}

#################################

source tickets_closed_master : db_master
{
        sql_query_pre           = REPLACE INTO sph_counter SELECT 'tickets_closed', MAX(gridimage_ticket_id),'$HOSTNAME' as server_id, NOW() FROM gridimage_ticket

        #something really trivial, but got most compatiblity, return a text field. Never searched, so doesnt matter what contains
        # the 15 seconds, is HOPEFULLY to give the slave time to catch up.
        sql_query = SELECT snippet_id,title,sleep(15) AS dummy FROM snippet WHERE enabled = 1 LIMIT 1
}
index tickets_closed_master
{
        type                    = plain
        source                  = tickets_closed_master
        path                    = /var/lib/manticore/data/tickets_closed_master
        docinfo                 = none
}
#################################

source tickets_closed_delta : db_slave
{
        sql_query_pre           = SET CHARACTER SET 'utf8'
        sql_query_pre           = SET SESSION query_cache_type=OFF
        sql_query_pre           = SET SESSION group_concat_max_len = 100000
	sql_query_pre           = SET SESSION max_statement_time = 600

        sql_query_pre           = SELECT GET_LOCK(CONCAT('tickets_closed',DATABASE()),36)

        sql_query_pre           = SELECT @max_doc_id := max_doc_id,@updated := updated FROM sph_counter WHERE counter_id='tickets_closed' and server_id='$HOSTNAME'

        sql_query               = \
                SELECT t.gridimage_ticket_id, t.status, UNIX_TIMESTAMP(t.suggested) AS suggested, \
                gi.title, gi.comment, if(gi.realname!='',gi.realname,u.realname) as realname, gs.grid_reference, \
                SUBSTRING(gs.grid_reference,1,LENGTH(gs.grid_reference)-4) AS myriad, \
                CONCAT(SUBSTRING(gs.grid_reference,1,LENGTH(gs.grid_reference)-3),SUBSTRING(gs.grid_reference,LENGTH(gs.grid_reference)-1,1)) AS hectad, \
                notes, s.realname AS suggester, moderation_status \
                FROM gridimage_ticket t \
                        INNER JOIN gridimage gi ON (gi.gridimage_id = t.gridimage_id) \
                        INNER JOIN gridsquare gs ON (gs.gridsquare_id = gi.gridsquare_id) \
                        INNER JOIN user AS u ON (u.user_id = gi.user_id) \
                        INNER JOIN user AS s ON (s.user_id = t.user_id) \
                WHERE t.status IN ('closed') \
		AND ( gridimage_ticket_id  > @max_doc_id OR t.updated >= @updated)

        sql_attr_timestamp      = suggested

        sql_query_post          = SELECT RELEASE_LOCK(CONCAT('tickets_closed',DATABASE()))
}

index tickets_closed_delta : latin1plus_encoded
{
	type                    = plain
        source                  = tickets_closed_delta
        path                    = /var/lib/manticore/data/tickets_closed
        min_word_len            = 1
	morphology              = stem_en
	index_exact_words       = 1
}

#################################

source tickets_closed_archive : db_slave
{
        sql_query_pre           = SET CHARACTER SET 'utf8'
        sql_query_pre           = SET SESSION query_cache_type=OFF
        sql_query_pre           = SET SESSION group_concat_max_len = 100000
	sql_query_pre           = SET SESSION max_statement_time = 600

        sql_query_pre           = SELECT GET_LOCK(CONCAT('tickets_closed',DATABASE()),36)

        sql_query_range         = SELECT 1, @max_doc_id := max_doc_id FROM sph_counter WHERE counter_id='tickets_closed' and server_id='$HOSTNAME'
	sql_range_step          = 100000

        sql_query               = \
                SELECT t.gridimage_ticket_id, t.status, UNIX_TIMESTAMP(t.suggested) AS suggested, \
                gi.title, gi.comment, if(gi.realname!='',gi.realname,u.realname) as realname, gs.grid_reference, \
                SUBSTRING(gs.grid_reference,1,LENGTH(gs.grid_reference)-4) AS myriad, \
                CONCAT(SUBSTRING(gs.grid_reference,1,LENGTH(gs.grid_reference)-3),SUBSTRING(gs.grid_reference,LENGTH(gs.grid_reference)-1,1)) AS hectad, \
                notes, s.realname AS suggester, moderation_status \
                FROM gridimage_ticket t \
                        INNER JOIN gridimage gi ON (gi.gridimage_id = t.gridimage_id) \
                        INNER JOIN gridsquare gs ON (gs.gridsquare_id = gi.gridsquare_id) \
                        INNER JOIN user AS u ON (u.user_id = gi.user_id) \
                        INNER JOIN user AS s ON (s.user_id = t.user_id) \
                WHERE t.status IN ('closed') \
		AND (t.gridimage_ticket_id>=\$start AND t.gridimage_ticket_id<=\$end)

        sql_attr_timestamp      = suggested

        sql_query_post          = SELECT RELEASE_LOCK(CONCAT('tickets_closed',DATABASE()))
}

index tickets_closed_archive : latin1plus_encoded
{
	type                    = plain
        source                  = tickets_closed_archive
        path                    = /var/lib/manticore/data/tickets_closed_archive
        min_word_len            = 1
	morphology              = stem_en
	index_exact_words       = 1
}

#################################

index tickets_closed {
        type = distributed
        local = tickets_closed_archive
        local = tickets_closed_delta
}

EOF

